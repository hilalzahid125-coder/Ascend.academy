{% extends "base.html" %}{% block content %}<section class="page-head"><div><span class="eyebrow">TEACHER PORTAL</span><h1>My account</h1><p>Keep your account secure.</p></div></section><section class="fee-section"><h2>Change password</h2><form class="fee-form" action="/teacher/account/password" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label><label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Confirm password<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button class="btn primary">Change password</button></form></section>{% endblock %}
